<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — Tē Pūō</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/admin.css">
</head>
<body class="admin-body">

  <!-- ============================================
       LOGIN SCREEN
       ============================================ -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1 class="login-title">Tē Pūō</h1>
      <p class="login-subtitle">Espace administration</p>

      <form id="login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="login-email" class="form-label">Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="admin@tepuo.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password" class="form-label">Mot de passe</label>
          <input type="password" id="login-password" class="form-input" placeholder="Votre mot de passe" required autocomplete="current-password">
        </div>
        <div id="login-error" class="login-error hidden" role="alert"></div>
        <button type="submit" id="login-btn" class="btn btn-primary login-btn">Se connecter</button>
      </form>
    </div>
  </div>

  <!-- ============================================
       ADMIN DASHBOARD
       ============================================ -->
  <div id="admin-dashboard" class="admin-dashboard hidden">
    <!-- Admin Header -->
    <header class="admin-header">
      <div class="admin-header-inner">
        <a href="index.html" class="logo">Tē Pūō</a>
        <div class="admin-header-right">
          <span id="admin-user-email" class="admin-user-email"></span>
          <button id="logout-btn" class="btn btn-secondary btn-sm">Déconnexion</button>
        </div>
      </div>
    </header>

    <!-- Tab Navigation -->
    <nav class="admin-tabs" aria-label="Sections d'administration">
      <button class="admin-tab active" data-tab="collections" aria-selected="true">Collections</button>
      <button class="admin-tab" data-tab="bijoux" aria-selected="false">Bijoux</button>
      <button class="admin-tab" data-tab="points-vente" aria-selected="false">Points de Vente</button>
      <button class="admin-tab" data-tab="journal" aria-selected="false">Journal</button>
      <button class="admin-tab" data-tab="contenu" aria-selected="false">Contenu</button>
      <button class="admin-tab" data-tab="pages" aria-selected="false">Pages</button>
    </nav>

    <!-- Main Content -->
    <main class="admin-main">
      <!-- Collections Tab -->
      <section id="tab-collections" class="tab-content active" role="tabpanel">
        <div class="tab-header">
          <h2 class="tab-title">Collections</h2>
          <button class="btn btn-primary btn-sm" data-action="add" data-entity="collection">Ajouter</button>
        </div>
        <div id="collections-list" class="entity-list">
          <div class="loading-state"><div class="loading-spinner"></div><p class="loading-text">Chargement...</p></div>
        </div>
      </section>

      <!-- Bijoux Tab -->
      <section id="tab-bijoux" class="tab-content" role="tabpanel">
        <div class="tab-header">
          <h2 class="tab-title">Bijoux</h2>
          <button class="btn btn-primary btn-sm" data-action="add" data-entity="jewelry">Ajouter</button>
        </div>
        <div id="jewelry-list" class="entity-list">
          <div class="loading-state"><div class="loading-spinner"></div><p class="loading-text">Chargement...</p></div>
        </div>
      </section>

      <!-- Points de Vente Tab -->
      <section id="tab-points-vente" class="tab-content" role="tabpanel">
        <div class="tab-header">
          <h2 class="tab-title">Points de Vente</h2>
          <button class="btn btn-primary btn-sm" data-action="add" data-entity="sales_point">Ajouter</button>
        </div>
        <div id="sales-points-list" class="entity-list">
          <div class="loading-state"><div class="loading-spinner"></div><p class="loading-text">Chargement...</p></div>
        </div>
      </section>

      <!-- Journal Tab -->
      <section id="tab-journal" class="tab-content" role="tabpanel">
        <div class="tab-header">
          <h2 class="tab-title">Journal</h2>
          <button class="btn btn-primary btn-sm" data-action="add" data-entity="blog_post">Ajouter</button>
        </div>
        <div id="blog-posts-list" class="entity-list">
          <div class="loading-state"><div class="loading-spinner"></div><p class="loading-text">Chargement...</p></div>
        </div>
      </section>

      <!-- Contenu Tab -->
      <section id="tab-contenu" class="tab-content" role="tabpanel">
        <div class="tab-header">
          <h2 class="tab-title">Contenu des pages</h2>
        </div>
        <div class="content-page-selector">
          <button class="content-page-btn active" data-content-page="home">Accueil</button>
          <button class="content-page-btn" data-content-page="atelier">L'Atelier</button>
          <button class="content-page-btn" data-content-page="entretien">Entretien</button>
        </div>
        <div id="content-editor" class="content-editor">
          <div class="loading-state"><div class="loading-spinner"></div><p class="loading-text">Chargement...</p></div>
        </div>
      </section>

      <!-- Pages Tab -->
      <section id="tab-pages" class="tab-content" role="tabpanel">
        <div class="tab-header">
          <h2 class="tab-title">Pages dynamiques</h2>
          <button class="btn btn-primary btn-sm" data-action="add" data-entity="page">Ajouter</button>
        </div>
        <div id="pages-list" class="entity-list">
          <div class="loading-state"><div class="loading-spinner"></div><p class="loading-text">Chargement...</p></div>
        </div>
      </section>
    </main>
  </div>

  <!-- ============================================
       MODAL (Add / Edit)
       ============================================ -->
  <div id="modal-overlay" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal" role="dialog" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title"></h3>
        <button id="modal-close" class="modal-close" aria-label="Fermer">&times;</button>
      </div>
      <form id="modal-form" class="modal-form" novalidate>
        <div id="modal-body" class="modal-body">
          <!-- Dynamic form fields -->
        </div>
        <div id="modal-error" class="login-error hidden" role="alert"></div>
        <div class="modal-footer">
          <button type="button" id="modal-cancel" class="btn btn-secondary btn-sm">Annuler</button>
          <button type="submit" id="modal-submit" class="btn btn-primary btn-sm">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============================================
       DELETE CONFIRMATION
       ============================================ -->
  <div id="confirm-overlay" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal modal-sm" role="alertdialog" aria-labelledby="confirm-title">
      <div class="modal-header">
        <h3 id="confirm-title" class="modal-title">Confirmer la suppression</h3>
        <button id="confirm-close" class="modal-close" aria-label="Fermer">&times;</button>
      </div>
      <div class="modal-body">
        <p id="confirm-message">Voulez-vous vraiment supprimer cet élément ?</p>
      </div>
      <div class="modal-footer">
        <button type="button" id="confirm-cancel" class="btn btn-secondary btn-sm">Annuler</button>
        <button type="button" id="confirm-delete" class="btn btn-danger btn-sm">Supprimer</button>
      </div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script type="module" src="scripts/admin.js"></script>
</body>
</html>
